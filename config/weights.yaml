# Scoring configuration — CLAUDE.md section 4.5.

#

# These weights are NEVER tuned to make a scenario produce the expected answer.

# If a ranking is wrong, print the per-term breakdown and find the broken term.



# 4.5.2 — hypothesis score terms. Must sum to 1.0.

score_weights:

  iou: 0.40

  centroid: 0.25

  orientation: 0.25

  area: 0.10



# Shape of each non-IoU term.

score_terms:

  centroid_decay_km: 10.0      # centroid_term = exp(-offset_km / decay)

  orientation_span_deg: 90.0   # retained for reference; see orientation_mode
  # CLAUDE.md 5.5 specifies cos(radians(delta)). "linear" (1 - delta/90) is the
  # earlier form, kept switchable because it penalises small misalignments
  # roughly 0.10-0.20 harder and is therefore a sharper discriminator.
  orientation_mode: cos        # cos | linear



# 4.5.4 — prior multipliers applied to the best score before softmax.

priors:

  # DEVIATION FROM CLAUDE.md 5.5, deliberate and documented.
  #
  # The spec says likelihood = softmax(geometric_score). The ORDER is followed
  # exactly (softmax -> priors -> renormalise); only the temperature differs,
  # and temperature is a calibration constant, not one of the scoring weights
  # that section 8 forbids tuning.
  #
  # Why: geometric_score is bounded in [0,1], so a plain softmax (T=1.0)
  # compresses it. exp(0.90)/exp(0.29) is only 1.8x, which priors of up to
  # 1.7x can overturn. Measured on demo-001 at T=1.0, a candidate whose
  # simulated slick was 86 degrees off with IoU 0.122 ranked SECOND on its
  # priors alone, above a candidate that scored twice as well. That inverts
  # the system's central claim that geometry decides and priors only modulate.
  #
  # T=0.25 restores geometry as the dominant term while leaving priors real
  # influence. T=0.05 was rejected: a 0.998 posterior is effectively the
  # binary accusation section 5.5 explicitly forbids.
  temperature: 0.25



  trust:

    clean: 1.0

    minor_flags: 0.9           # any WARN trust flag

    major_flags: 0.6           # any CRITICAL trust flag

    identity_mismatch: 1.3     # spoofing is evidence of intent, not innocence



  behaviour:

    normal: 1.0

    loitering: 1.25

    unexplained_slowdown: 1.20

    course_deviation: 1.15

    night_manoeuvring: 1.10

    ais_gap_in_aoi: 1.35       # going dark over the origin envelope



  proximity:

    in_envelope: 1.0

    envelope_edge: 0.8         # within tolerance band but not strictly inside

  # CLAUDE.md 5.5: tanker/bulk > container > fishing. Matched on substrings
  # of the AIS-declared vessel type, lowercased.
  type_risk:
    tanker: 1.40
    bulk: 1.25
    cargo: 1.10
    container: 1.00
    tug: 0.85
    fishing: 0.70
    default: 1.00

  # A vessel that went dark exactly when the release is estimated to begin.
  gap_coincidence: 1.8
  # posterior multiplier is (1 + prior_offence_weight * prior_offences)
  prior_offence_weight: 0.4



# 4.5.5 — slick age cross-check.

fay:

  spreading_exponent: 0.75     # area ~ t^0.75

  # Agreement is a ratio test: the two estimates agree when Fay is within this
  # factor of the drift-derived age. A flat hour tolerance passes 1.2 h against
  # 5.5 h, which is a factor of four and not agreement at all.
  agreement_factor: 2.0
  agreement_tolerance_hours: 6.0   # retained for reference; no longer used

  # Area a reference discharge reaches after 1 hour. Encodes an assumed release

  # volume and oil type, so the Fay figure is a consistency check against an

  # assumed spreading rate - NOT an independent measurement. Reported as such.

  reference_area_km2_at_1h: 18.0



# 4.5.1 — drift physics.

drift:

  wind_factor: 0.03

  wind_deflection_deg: 15.0    # clockwise, northern hemisphere

  timestep_min: 5

  diffusion_k_m2s: 5.0

  n_particles: 500



# 4.1 — detection gates.

detection:

  wind_gate_min_ms: 3.0

  wind_gate_max_ms: 10.0

  anomaly_sigmoid_offset: 1.5

  tile_px: 512

  tile_overlap_px: 64



# 4.2 — baseline.

baseline:

  h3_resolution: 7

  min_scenes_for_local: 15



# 4.3 — CFAR.

cfar:

  k: 4.5



# 4.4 — trust thresholds.

trust:

  # Segments spanning a speed change larger than this are treated as
  # genuine manoeuvres and excluded from the SOG consistency check.
  manoeuvre_sog_delta_kn: 3.0
  sog_disagreement_kn: 5.0

  ais_gap_min: 15.0



# Layer 11 — dissemination thresholds (CLAUDE.md 5.8).
#
# Tiers are NOS-DCP tiers, not an invented scale: the tier decides who is on the
# distribution list, so it has to match the plan the Coast Guard operates under.
# These are volume-proxy thresholds — NOS-DCP is written in tonnes and SAR gives
# area, so area stands in for volume. Say that out loud rather than implying the
# system measures tonnage.
dissemination:
  tier2_area_km2: 25.0          # >= this -> Tier II, regional HQ + MRCC added
  tier3_area_km2: 150.0         # >= this -> Tier III, Coast Guard HQ added
  tier3_shore_eta_hours: 24.0   # shoreline contact sooner than this -> Tier III
  tier2_shore_eta_hours: 72.0   # shoreline contact within the forecast -> Tier II
  max_recipients: 6
