[project]
name = "samudra"
version = "0.1.0"
description = "SAR-based maritime oil spill attribution and evidence system"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "geopandas",
    "shapely",
    "pyproj",
    "h3",
    "duckdb",
    "pydantic",
    "fastapi",
    "uvicorn",
    "reportlab",
    "matplotlib",
    "requests",
    "scipy",
    "rasterio",
    "scikit-learn",
    "pyarrow",
    "pyyaml",
    "Pillow",
  "zstandard",
  # Layer 3 detection. CPU wheels by default; install the CUDA build from
  # https://download.pytorch.org/whl/cu121 for the full training run.
  "torch",
  "torchvision",
    "zstandard",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    # Tests that hit a real provider endpoint. Deliberately NOT mocked: the
    # claim being tested is that the live path talks to a real catalogue, and a
    # mock would prove the opposite of what is needed. Deselect on a box with
    # no egress:  pytest -m "not live"
    "live: requires network access to a satellite data provider",
]
